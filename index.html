<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <title>Our Storybook</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="stage">
        <div class="ambient-glow"></div>
        <section class="book-scene" aria-label="Our wedding storybook">
            <div class="book" id="book">
                <div class="page-stack page-stack-left"></div>
                <div class="page-stack page-stack-right"></div>

                <div class="inside-spread">
                    <article class="inside-page inside-left">
                        <div class="page-inner">
                            <p class="small-ornament">✦</p>
                            <p class="inside-kicker">Ssu-Yu & Chin-I</p>
                        </div>
                    </article>
                    <article class="inside-page inside-right">
                        <div class="page-inner title-page">
                            <p class="title-small">2022 · 2026</p>
                            <h2>Our Story</h2>
                            <p class="title-quote">
                                Every day still feels like newlyweds.
                            </p>
                        </div>
                    </article>
                </div>
                <div class="front-cover" id="frontCover">
<img class="cover-ornament" src="assets/images/cover-frame.png" alt="">
<div class="cover-content">
<p class="cover-kicker">2022 · 2026</p>
<h1>Our Storybook</h1>
<p class="names">Ssu-Yu & Chin-I</p>
<p class="cover-quote">Every day still feels like newlyweds.</p>
</div>
                    <div class="spine-ridge"></div>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
